<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamora Tag Studio ♡</title><link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:#565169;font-family:Quicksand;background:radial-gradient(circle at 15% 10%,#ffe4ef,transparent 30%),radial-gradient(circle at 90% 20%,#dff3ff,transparent 28%),#fdf8f1}.card{width:min(100%,480px);background:#fffdf9;padding:25px;border-radius:22px;box-shadow:0 18px 45px #493b4920}.brand{font:42px "Darumadrop One";margin:0}.sub{font-size:12px;line-height:1.6;margin:5px 0 20px}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#565169;color:#fff;font:19px "Darumadrop One";cursor:pointer}.result{display:none;margin-top:18px;padding:16px;background:#fde8ef;border-radius:15px}.code{font:28px "Darumadrop One";letter-spacing:.05em}.url{font-size:10px;overflow-wrap:anywhere;margin:8px 0 12px}.copy{border:1px solid #d8ced6;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;color:#565169;cursor:pointer}.status{font-size:10px;margin-top:12px}.list{margin-top:22px}.list h2{font:26px "Darumadrop One";margin:0 0 10px}.tagrow{padding:12px 0;border-top:1px dashed #d8ced6}.tagtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.tagcode{font:19px "Darumadrop One"}.badge{font-size:9px;font-weight:700;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:#f5dfa0}.badge.claimed{background:#dfeeda}.badge.written{background:#e4dcf7}.tagurl{font-size:9px;overflow-wrap:anywhere;margin-top:4px}.tagactions{margin-top:8px}.tagactions .copy{font-size:9px;padding:7px 10px}.empty{font-size:11px;opacity:.65}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script></head><body><main class="card"><h1 class="brand">Dreamora Tag Studio ♡</h1><p class="sub">Create a fresh unclaimed Dreamora code before writing a product NFC or printing its QR.</p><button class="btn" id="make">+ CREATE NEW DREAMORA TAG</button><section class="result" id="result"><div>NEW UNCLAIMED TAG</div><div class="code" id="code"></div><div class="url" id="url"></div><button class="copy" id="copy">COPY ACTIVATION URL</button></section><div class="status" id="status"></div><section class="list"><h2>My Dreamora Tags</h2><div id="tagList" class="empty">Loading tags…</div></section></main><script>firebase.initializeApp({apiKey:"AIzaSyCPdqqY0lWn58YczzavjsF08dYIhM6-O5I",authDomain:"dreamora-app.firebaseapp.com",projectId:"dreamora-app"});const auth=firebase.auth(),make=document.getElementById('make'),status=document.getElementById('status'),result=document.getElementById('result');const activationUrl=tag=>location.origin+'/activate.html?tag='+encodeURIComponent(tag);async function copyText(text,msg){try{await navigator.clipboard.writeText(text);status.textContent=msg}catch(e){status.textContent='Could not copy URL.'}}async function loadTags(u){try{const token=await u.getIdToken(),r=await fetch('/api/list-tags',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw new Error(d.error);const box=document.getElementById('tagList');if(!d.tags.length){box.className='empty';box.textContent='No tags created yet ♡';return}box.className='';box.innerHTML=d.tags.map(t=>{const claimed=t.status==='claimed',written=t.status==='written';const action=claimed&&t.boardSlug?'<div class="tagactions"><button class="copy view-board" data-slug="'+encodeURIComponent(t.boardSlug)+'">VIEW BOARD</button></div>':'<div class="tagactions"><button class="copy copy-tag" data-tag="'+encodeURIComponent(t.tag)+'">COPY ACTIVATION URL</button>'+(written?'':' <button class="copy mark-written" data-tag="'+encodeURIComponent(t.tag)+'">MARK AS WRITTEN</button>')+'</div>';return '<div class="tagrow"><div class="tagtop"><span class="tagcode">'+t.tag+'</span><span class="badge '+(claimed?'claimed':written?'written':'')+'">'+t.status+'</span></div><div class="tagurl">'+(claimed&&t.boardSlug?'Board: ?b='+t.boardSlug:written?'NFC already programmed':'Ready for activation')+'</div>'+action+'</div>'}).join('');box.querySelectorAll('.copy-tag').forEach(b=>b.onclick=()=>copyText(activationUrl(decodeURIComponent(b.dataset.tag)),'Activation URL copied ♡'));box.querySelectorAll('.view-board').forEach(b=>b.onclick=()=>location.href='/?b='+decodeURIComponent(b.dataset.slug));box.querySelectorAll('.mark-written').forEach(b=>b.onclick=async()=>{const tag=decodeURIComponent(b.dataset.tag);b.disabled=true;status.textContent='Marking '+tag+' as written…';try{const token=await auth.currentUser.getIdToken(),r=await fetch('/api/mark-tag-written',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({tag})}),d=await r.json();if(!r.ok)throw new Error(d.error);status.textContent=tag+' marked as WRITTEN ♡';await loadTags(auth.currentUser)}catch(e){status.textContent=e.message||'Could not update tag.';b.disabled=false}})}catch(e){document.getElementById('tagList').textContent=e.message||'Could not load tags.'}}auth.onAuthStateChanged(u=>{if(!u){location.replace('login.html?next=admin');return}loadTags(u)});make.onclick=async()=>{const u=auth.currentUser;if(!u)return;make.disabled=true;status.textContent='Creating a fresh tag…';try{const token=await u.getIdToken(),r=await fetch('/api/create-tag',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('code').textContent=d.tag;document.getElementById('url').textContent=d.url;result.style.display='block';result.dataset.url=d.url;status.textContent='Ready to write to NFC ♡';await loadTags(u)}catch(e){status.textContent=e.message||'Could not create tag.'}finally{make.disabled=false}};document.getElementById('copy').onclick=()=>copyText(result.dataset.url||'','Activation URL copied ♡')</script></body></html>
