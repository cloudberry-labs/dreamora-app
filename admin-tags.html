<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamora Tag Studio ♡</title><link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:#565169;font-family:Quicksand;background:radial-gradient(circle at 15% 10%,#ffe4ef,transparent 30%),radial-gradient(circle at 90% 20%,#dff3ff,transparent 28%),#fdf8f1}.card{width:min(100%,480px);background:#fffdf9;padding:25px;border-radius:22px;box-shadow:0 18px 45px #493b4920}.brand{font:42px "Darumadrop One";margin:0}.sub{font-size:12px;line-height:1.6;margin:5px 0 20px}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#565169;color:#fff;font:19px "Darumadrop One";cursor:pointer}.result{display:none;margin-top:18px;padding:16px;background:#fde8ef;border-radius:15px}.code{font:28px "Darumadrop One";letter-spacing:.05em}.url{font-size:10px;overflow-wrap:anywhere;margin:8px 0 12px}.copy{border:1px solid #d8ced6;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;color:#565169}.status{font-size:10px;margin-top:12px}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script></head><body><main class="card"><h1 class="brand">Dreamora Tag Studio ♡</h1><p class="sub">Create a fresh unclaimed Dreamora code before writing a product NFC or printing its QR.</p><button class="btn" id="make">+ CREATE NEW DREAMORA TAG</button><section class="result" id="result"><div>NEW UNCLAIMED TAG</div><div class="code" id="code"></div><div class="url" id="url"></div><button class="copy" id="copy">COPY ACTIVATION URL</button></section><div class="status" id="status"></div></main><script>firebase.initializeApp({apiKey:"AIzaSyCPdqqY0lWn58YczzavjsF08dYIhM6-O5I",authDomain:"dreamora-app.firebaseapp.com",projectId:"dreamora-app"});const auth=firebase.auth(),make=document.getElementById('make'),status=document.getElementById('status'),result=document.getElementById('result');auth.onAuthStateChanged(u=>{if(!u)location.replace('login.html')});make.onclick=async()=>{const u=auth.currentUser;if(!u)return;make.disabled=true;status.textContent='Creating a fresh tag…';try{const token=await u.getIdToken(),r=await fetch('/api/create-tag',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('code').textContent=d.tag;document.getElementById('url').textContent=d.url;result.style.display='block';result.dataset.url=d.url;status.textContent='Ready to write to NFC ♡'}catch(e){status.textContent=e.message||'Could not create tag.'}finally{make.disabled=false}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(result.dataset.url||'');status.textContent='Activation URL copied ♡'}</script></body></html>
