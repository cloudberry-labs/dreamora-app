<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fdf8f1"><meta name="robots" content="noindex,nofollow"><title>Dreamora ♡ Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Darumadrop+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#565169;--pink:#eaa1bf;--blue:#9bd8f7;--lav:#c9b9ed;--sage:#b8cfb1;--peach:#f5b58f;--yellow:#f5dfa0;--cream:#fdf8f1}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;color:var(--ink);font-family:Quicksand,sans-serif;background:radial-gradient(circle at 15% 12%,#ffe7f1 0,transparent 28%),radial-gradient(circle at 88% 20%,#e3f5ff 0,transparent 25%),radial-gradient(circle at 70% 78%,#eee7ff 0,transparent 26%),radial-gradient(#d9d1cb 1px,transparent 1px),var(--cream);background-size:auto,auto,auto,18px 18px}.shell{width:min(100%,410px);text-align:center}.tiny{display:inline-block;background:#fff0b8;padding:3px 12px;font:600 18px Caveat,cursive;transform:rotate(-2deg);box-shadow:0 2px 0 #ead7a1}.logo{font:400 58px/1 "Darumadrop One";margin:10px 0 2px;text-shadow:2px 3px #fff}.sub{font:600 18px Caveat,cursive;margin-bottom:22px}.card{position:relative;background:#fffdf9;padding:30px 24px 24px;text-align:left;border:1px solid #56516914;box-shadow:0 13px 30px #493b4920;transform:rotate(-.4deg)}.tape{position:absolute;top:-10px;left:50%;width:72px;height:20px;transform:translateX(-50%) rotate(2deg);background:#eaa1bf80}.card h2{font:400 29px/1 "Darumadrop One";text-align:center;margin:0 0 21px}.field{margin:14px 0}.field label{display:block;font:700 11px Quicksand;letter-spacing:.06em;margin:0 0 6px 3px}.field input{width:100%;border:1.5px solid #dcd2d8;background:#fffafc;border-radius:12px;padding:13px 14px;font:600 14px Quicksand;color:var(--ink);outline:none}.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px #eaa1bf22}.password-wrap{position:relative}.password-wrap input{padding-right:52px}.peek{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font:700 11px Quicksand;cursor:pointer}.forgot{display:block;text-align:right;color:#77708a;font-size:11px;margin:8px 2px 16px;text-decoration:none}.login{width:100%;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,#eaa1bf,#c9b9ed);color:#fff;font:400 20px "Darumadrop One";box-shadow:0 6px 13px #b787aa38;cursor:pointer}.login:active{transform:translateY(2px)}.new{text-align:center;font-size:11px;margin:18px 0 2px}.new a{color:#7b70a0;font-weight:700}.back{display:inline-block;margin-top:18px;color:#77708a;font:600 14px Caveat,cursive;text-decoration:none}.decor{position:absolute;font:400 25px Caveat,cursive;opacity:.5}.d1{left:10px;top:10px}.d2{right:10px;bottom:8px}.demo{text-align:center;font-size:10px;opacity:.55;margin-top:14px}.msg{display:none;margin:12px 0 0;padding:9px 10px;border-radius:10px;font-size:10px;text-align:center;background:#f8e7ef}.msg.show{display:block}.msg.ok{background:#e5f1e1}.login:disabled{opacity:.6;cursor:wait}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script></head><body><main class="shell"><span class="tiny">your dreams are waiting ✨</span><div class="logo">Dreamora ♡</div><div class="sub">a little doorway to your dream life</div><section class="card"><span class="tape"></span><span class="decor d1">✦</span><span class="decor d2">♡</span><h2>Welcome back, dreamer</h2><form id="loginForm"><div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">PASSWORD</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required><button class="peek" type="button" id="peek">SHOW</button></div></div><a class="forgot" href="#" id="forgot">Forgot password?</a><button class="login" type="submit">Log in to my Dreamora ♡</button><div class="new">New to Dreamora? <a href="#" id="create">Create your account</a></div><div class="msg" id="msg"></div></form></section><a class="back" href="./">← peek at the public board</a><div class="demo">Your Dreamora Studio is protected by Firebase Authentication ♡</div></main><script>const firebaseConfig={apiKey:"AIzaSyCPdqqY0lWn58YczzavjsF08dYIhM6-O5I",authDomain:"dreamora-app.firebaseapp.com",projectId:"dreamora-app",storageBucket:"dreamora-app.firebasestorage.app",messagingSenderId:"609829561350",appId:"1:609829561350:web:ac8f053ceb5f00f9808f87",measurementId:"G-PQYM9PG393"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();
const p=document.getElementById('password'),b=document.getElementById('peek'),form=document.getElementById('loginForm'),email=document.getElementById('email'),msg=document.getElementById('msg'),submit=form.querySelector('.login');const params=new URLSearchParams(location.search),mode=params.get('mode')||'login',tag=(params.get('tag')||'').trim(),next=params.get('next')==='admin'?'admin-tags.html':'studio.html';const createLink=document.getElementById('create');if(mode==='signup'){document.querySelector('.card h2').textContent='Create your Dreamora ♡';submit.textContent='CREATE MY DREAMORA ✨';document.querySelector('.new').innerHTML='Already have an account? <a href="#" id="switchLogin">Log in instead</a>';document.getElementById('switchLogin').onclick=e=>{e.preventDefault();location.href='login.html?mode=login'+(tag?'&tag='+encodeURIComponent(tag):'')}}
function say(t,ok=false){msg.textContent=t;msg.className='msg show'+(ok?' ok':'')}
function friendly(e){const c=e.code||'';if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'That email or password does not match ♡';if(c.includes('email-already-in-use'))return 'That email already has a Dreamora account ♡';if(c.includes('weak-password'))return 'Choose a password with at least 6 characters ♡';if(c.includes('invalid-email'))return 'Please enter a valid email address ♡';if(c.includes('too-many-requests'))return 'Too many tries for now. Please wait a little and try again ♡';return e.message||'Something went wrong. Please try again ♡'}
b.onclick=()=>{const show=p.type==='password';p.type=show?'text':'password';b.textContent=show?'HIDE':'SHOW'};
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent=mode==='signup'?'Creating your Dreamora…':'Opening your Studio…';try{if(mode==='signup')await auth.createUserWithEmailAndPassword(email.value.trim(),p.value);else await auth.signInWithEmailAndPassword(email.value.trim(),p.value);location.replace(next+(next==='studio.html'&&tag?'?activate='+encodeURIComponent(tag):''))}catch(err){say(friendly(err));submit.disabled=false;submit.textContent=mode==='signup'?'CREATE MY DREAMORA ✨':'Log in to my Dreamora ♡'}};
if(createLink)createLink.onclick=e=>{e.preventDefault();location.href='login.html?mode=signup'+(tag?'&tag='+encodeURIComponent(tag):'')};
document.getElementById('forgot').onclick=async e=>{e.preventDefault();const em=email.value.trim();if(!em){say('Type your real email above first, then tap Forgot password ♡');email.focus();return}try{await auth.sendPasswordResetEmail(em);say('Password reset email sent to '+em+' ♡',true)}catch(err){say(friendly(err))}};
auth.onAuthStateChanged(async user=>{if(!user)return;if(tag&&mode==='signup'){try{await auth.signOut()}catch(e){}return}location.replace(next+(next==='studio.html'&&tag?'?activate='+encodeURIComponent(tag):''))});
</script></body></html>
