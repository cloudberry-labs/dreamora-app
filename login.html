<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fdf8f1"><meta name="robots" content="noindex,nofollow"><title>Dreamora ♡ Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Darumadrop+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#565169;--pink:#eaa1bf;--blue:#9bd8f7;--lav:#c9b9ed;--sage:#b8cfb1;--peach:#f5b58f;--yellow:#f5dfa0;--cream:#fdf8f1}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;color:var(--ink);font-family:Quicksand,sans-serif;background:radial-gradient(circle at 15% 12%,#ffe7f1 0,transparent 28%),radial-gradient(circle at 88% 20%,#e3f5ff 0,transparent 25%),radial-gradient(circle at 70% 78%,#eee7ff 0,transparent 26%),radial-gradient(#d9d1cb 1px,transparent 1px),var(--cream);background-size:auto,auto,auto,18px 18px}.shell{width:min(100%,410px);text-align:center}.tiny{display:inline-block;background:#fff0b8;padding:3px 12px;font:600 18px Caveat,cursive;transform:rotate(-2deg);box-shadow:0 2px 0 #ead7a1}.logo{font:400 58px/1 "Darumadrop One";margin:10px 0 2px;text-shadow:2px 3px #fff}.sub{font:600 18px Caveat,cursive;margin-bottom:22px}.card{position:relative;background:#fffdf9;padding:30px 24px 24px;text-align:left;border:1px solid #56516914;box-shadow:0 13px 30px #493b4920;transform:rotate(-.4deg)}.tape{position:absolute;top:-10px;left:50%;width:72px;height:20px;transform:translateX(-50%) rotate(2deg);background:#eaa1bf80}.card h2{font:400 29px/1 "Darumadrop One";text-align:center;margin:0 0 21px}.field{margin:14px 0}.field label{display:block;font:700 11px Quicksand;letter-spacing:.06em;margin:0 0 6px 3px}.field input{width:100%;border:1.5px solid #dcd2d8;background:#fffafc;border-radius:12px;padding:13px 14px;font:600 14px Quicksand;color:var(--ink);outline:none}.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px #eaa1bf22}.password-wrap{position:relative}.password-wrap input{padding-right:52px}.peek{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font:700 11px Quicksand;cursor:pointer}.forgot{display:block;text-align:right;color:#77708a;font-size:11px;margin:8px 2px 16px;text-decoration:none}.login{width:100%;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,#eaa1bf,#c9b9ed);color:#fff;font:400 20px "Darumadrop One";box-shadow:0 6px 13px #b787aa38;cursor:pointer}.login:active{transform:translateY(2px)}.new{text-align:center;font-size:11px;margin:18px 0 2px}.new a{color:#7b70a0;font-weight:700}.back{display:inline-block;margin-top:18px;color:#77708a;font:600 14px Caveat,cursive;text-decoration:none}.decor{position:absolute;font:400 25px Caveat,cursive;opacity:.5}.d1{left:10px;top:10px}.d2{right:10px;bottom:8px}.demo{text-align:center;font-size:10px;opacity:.55;margin-top:14px}</style></head><body><main class="shell"><span class="tiny">your dreams are waiting ✨</span><div class="logo">Dreamora ♡</div><div class="sub">a little doorway to your dream life</div><section class="card"><span class="tape"></span><span class="decor d1">✦</span><span class="decor d2">♡</span><h2>Welcome back, dreamer</h2><form id="loginForm"><div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">PASSWORD</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required><button class="peek" type="button" id="peek">SHOW</button></div></div><a class="forgot" href="#" onclick="return false">Forgot password?</a><button class="login" type="submit">Log in to my Dreamora ♡</button><div class="new">New to Dreamora? <a href="#" onclick="return false">Create your account</a></div></form></section><a class="back" href="./">← peek at the public board</a><div class="demo">Visual prototype only — account authentication comes next.</div></main><script>const p=document.getElementById('password'),b=document.getElementById('peek');b.onclick=()=>{const show=p.type==='password';p.type=show?'text':'password';b.textContent=show?'HIDE':'SHOW'};document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();alert('Dreamora login design is ready ♡\n\nNext step: connect real account authentication.');};</script></body></html>
