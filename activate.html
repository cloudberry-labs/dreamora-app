<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fdf8f1"><meta name="robots" content="noindex,nofollow"><title>Activate Dreamora ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Darumadrop+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#565169;--pink:#eaa1bf;--blue:#9bd8f7;--lav:#c9b9ed;--cream:#fdf8f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Quicksand,sans-serif;background:radial-gradient(circle at 12% 8%,#ffe3ef 0,transparent 27%),radial-gradient(circle at 90% 18%,#dff3ff 0,transparent 27%),radial-gradient(circle at 62% 78%,#eee5ff 0,transparent 25%),radial-gradient(#d9d1cb 1px,transparent 1px),var(--cream);background-size:auto,auto,auto,18px 18px;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);background:#fffdf9e8;border:1px solid #fff;border-radius:24px;padding:30px 24px 25px;box-shadow:0 18px 45px #493b4920;text-align:center;position:relative;overflow:hidden}.tape{position:absolute;width:76px;height:19px;background:#eaa1bf55;top:7px;left:50%;transform:translateX(-50%) rotate(-2deg)}.spark{font-size:25px;margin:8px 0}.brand{font:400 50px/.95 "Darumadrop One";margin:4px 0}.hello{font:700 23px/1.1 Caveat;margin:13px 0 8px}.copy{font-size:12px;line-height:1.65;max-width:330px;margin:0 auto 22px;opacity:.78}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 23px}.step{padding:11px 5px;background:#fff;border:1px dashed #d9cbd4;border-radius:14px;font-size:9px;line-height:1.35}.step b{display:block;font-size:18px;margin-bottom:4px}.primary,.secondary{width:100%;border-radius:14px;padding:13px 14px;cursor:pointer;font-weight:700}.primary{border:0;background:var(--ink);color:white;font:400 18px "Darumadrop One"}.secondary{margin-top:9px;border:1px solid #d8ced6;background:#fff9;color:var(--ink);font-size:10px}.tiny{font:600 12px Caveat;margin-top:16px;opacity:.65}@media(max-width:360px){.card{padding-left:17px;padding-right:17px}.brand{font-size:44px}}</style></head>
<body><main class="card"><div class="tape"></div><div class="spark">✨🎀✨</div><h1 class="brand">Dreamora ♡</h1><div class="hello">Your little place for big dreams is waiting.</div><p class="copy">Activate your Dreamora to create your own private Studio and a beautiful public vision board made just for you.</p><div class="steps"><div class="step"><b>♡</b>Activate</div><div class="step"><b>📌</b>Pin dreams</div><div class="step"><b>✨</b>Make them real</div></div><button class="primary" id="activate">ACTIVATE MY DREAMORA ✨</button><button class="secondary" id="login">I ALREADY HAVE AN ACCOUNT</button><div class="tiny">dream it • pin it • live it ♡</div></main>
<script>
const params=new URLSearchParams(location.search),tag=(params.get('tag')||'').trim();
function go(mode){const q=new URLSearchParams();q.set('mode',mode);if(tag)q.set('tag',tag);location.href='login.html?'+q.toString()}
document.getElementById('activate').onclick=()=>go('signup');document.getElementById('login').onclick=()=>go('login');
(async()=>{if(!tag)return;try{const response=await fetch('/api/resolve-tag?tag='+encodeURIComponent(tag)),d=await response.json();if(response.ok&&d.status==='claimed'&&d.boardSlug){location.replace('./?b='+encodeURIComponent(d.boardSlug));return}if(!response.ok||!d.valid){document.getElementById('activate').disabled=true;document.getElementById('activate').textContent='INVALID DREAMORA TAG';document.getElementById('login').style.display='none'}}catch(e){console.warn('Could not resolve Dreamora tag',e)}})();
</script></body></html>
